name: CI

# Text only (Markdown, docs/, the license) changes no code: on main no run, docs.yml checks docs/.
# A pull request always runs, so a required check never stays "Pending".
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call: # a later release.yml runs the same checks before publishing
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: `checks pr` compares the branch with its base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Solid 1.x forms (CLAUDE.md, "Solid 2.0"; docs/solid-2.0/MIGRATION.md)
      - run: bun run solid2
      # The shared rule checks of firsttris/workflows (checks.json: files past 400 lines, functions past 80,
      # rings of imports between packages, every text translated and used, every page in the axe spec).
      # Installed without saving: the agents' environment cannot fetch GitHub tarballs, so package.json
      # cannot name it without breaking `bun install` there.
      - run: bun add --dev --no-save "github:firsttris/workflows#v1"
      - run: bunx checks
      - if: github.event_name == 'pull_request'
        run: bunx checks pr
      - run: bun run test
      - run: bun run build
      # The compiled binary starts on its own and answers /health
      - run: bun scripts/smoke-binary.ts
      # Known vulnerabilities in the dependencies fail the run
      - run: bun audit

  # Four parts in parallel (Playwright --shard), as in Haben: 290 tests took 8 minutes on one runner
  # with two workers. Each part starts its own servers on a fresh database (playwright.config.ts).
  e2e-teil:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Chromium from the cache, per Playwright version; the system libraries come on every run
      - id: playwright
        run: echo "version=$(bun --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # Projects desktop, phone and terminal (playwright.config.ts), four workers per part
      - name: e2e, part ${{ matrix.teil }} of 4
        run: bun run e2e --shard=${{ matrix.teil }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.teil }}
          path: test-results/
          retention-days: 7

  # One result named e2e, however many parts the tests run in
  e2e:
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: e2e-teil
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-teil.result }}" = success

  # The container image (Containerfile, BAULISTE.md S-905): built for amd64 with the same build
  # cache as the release, then started on an empty volume with a key made for this run, asked for
  # /health, and backed up and restored inside (scripts/image-test.sh). arm64 builds only in the
  # release, on GitHub's ARM runner (docs/plan.md, "Entscheidungen").
  image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # keeps the build cache in ghcr.io; a fork without it only builds slower
    steps:
      - uses: actions/checkout@v7
      - uses: firsttris/workflows/actions/docker-build@v1
        with:
          dockerfile: Containerfile
          tags: soll:ci
          build-args: SOLL_VERSION=ci
      - run: bash scripts/image-test.sh soll:ci
