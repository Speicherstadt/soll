name: CI

# Text only (Markdown, docs/, the license) changes no code: on main no run, docs.yml checks docs/.
# A pull request always runs, so a required check never stays "Pending".
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call: # a later release.yml runs the same checks before publishing
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # PostgreSQL for the tests of the modules and the seals (gobd-kern triggers); a throwaway database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: soll
          POSTGRES_PASSWORD: soll
          POSTGRES_DB: soll_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soll" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://soll:soll@localhost:5432/soll_test
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: `checks pr` compares the branch with its base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The shared rule checks of firsttris/workflows (checks.json: files past 400 lines, functions past 80,
      # rings of imports between packages; i18n and pages once Paraglide and the routes are in). Installed without
      # saving, as some environments cannot fetch GitHub tarballs; S-101 moves it into package.json where it can.
      - run: bun add --dev --no-save "github:firsttris/workflows#v1"
      - run: bunx checks
      - if: github.event_name == 'pull_request'
        run: bunx checks pr
      - run: bun run test
      - run: bun run build
      # Known vulnerabilities in the dependencies fail the run
      - run: bun audit
