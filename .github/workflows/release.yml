name: Release

# A tag vX.Y.Z publishes that version (docs/installation.md): first the whole CI (skipped when the
# CI on main already tested the same code, firsttris/workflows "Tested on main"), then the shared
# Docker release of firsttris/workflows. It checks the tag against package.json, builds amd64 and
# arm64 each on its own runner, pushes :x.y.z, :x.y and :latest to Docker Hub and GHCR and creates
# the GitHub release; a tag vX.Y.Z-rc.N pushes :x.y.z-rc.N and :next. Started by hand on main: the
# same checks, then the image as :edge, no release.
#
# Nothing is published without the Docker Hub token: while the secret DOCKER_PAT is missing (BAULISTE.md,
# "Schritte für Menschen"), the run stops after the checks and says so in its summary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zugang:
    runs-on: ubuntu-latest
    outputs:
      vorhanden: ${{ steps.pruefen.outputs.vorhanden }}
    steps:
      # A secret cannot stand in a job's `if`; this step turns "set or not" into an output, never the value
      - id: pruefen
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [[ -n "$DOCKER_PAT" ]]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKER_PAT is not set: nothing is published"
            echo "Kein Docker-Hub-Token (Secret DOCKER_PAT): Es wird nichts veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          fi

  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # the CI's image job keeps the build cache

  # Secrets by name instead of `inherit`: `inherit` reaches only workflows of the same owner, and
  # firsttris/workflows belongs to another one than Speicherstadt/soll
  docker:
    needs: [zugang, tested, checks]
    # The checks passed or were not needed, and the token is there
    if: ${{ !cancelled() && needs.zugang.outputs.vorhanden == 'true' && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: ${{ vars.DOCKERHUB_IMAGE || 'tristanteu/soll' }}
      dockerhub-user: ${{ vars.DOCKERHUB_USER || 'tristanteu' }}
      # Docker Hub allows at most 100 characters
      description: "Selbst gehostete Zeiterfassung und Dienstplan für kleine Betriebe, nach dem Arbeitszeitgesetz"
      dockerfile: Containerfile
      ghcr: true
      build-args: |
        SOLL_VERSION=${{ github.ref_name }}
        SOLL_COMMIT=${{ github.sha }}
    secrets:
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    permissions:
      contents: write
      packages: write
