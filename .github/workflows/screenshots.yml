name: Update screenshots

# The pictures of README.md and docs/ (BAULISTE.md S-908, docs/entwicklung.md "Screenshots"):
# `bun run screenshots` builds the app, writes the demo data (S-909) into a fresh temporary
# directory, starts the server there on a fixed clock and takes every screen of
# scripts/screenshots/bildschirme.ts light and dark on desktop, phone and the terminal. Only by
# hand: Actions → Update screenshots → Run workflow. Commits changed pictures directly to the
# branch using the deploy key so on: push workflows (Docs on main) run on the new commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      lockfile: bun.lock
      bun: true
      # Same version as packageManager in package.json
      bun-version: 1.4.5
      install: bun install --frozen-lockfile
      command: bun run generate && bun run screenshots
      paths: docs/assets/screenshots
      commit-message: "docs: update screenshots"
    # Pushes with a deploy key (bypassing any ruleset on main) so on: push workflows run
    secrets:
      deploy-key: ${{ secrets.BUMP_DEPLOY_KEY }}
    permissions:
      contents: write
