# Documentation as a website: https://soll.work/
# Source is docs/, built with Zensical, which reads this file as it is
# (https://zensical.org/docs/setup/basics/); .github/workflows/docs.yml publishes it.
# Locally: pip install -r requirements-docs.txt && zensical serve
# German only.
site_name: Soll
site_description: >-
  Soll: die selbst gehostete Zeiterfassung mit Dienstplan für kleine Betriebe – Prüfung nach
  Arbeitszeitgesetz, Monatsabschluss, DATEV-Export, ohne Kosten pro Kopf.
site_author: Tristan Teufel
site_url: https://soll.work/
repo_url: https://github.com/Speicherstadt/soll
repo_name: Speicherstadt/soll
edit_uri: edit/main/docs/
copyright: >-
  Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende ·
  <a href="https://teufel-it.de/de/impressum/">Impressum</a> ·
  <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>
use_directory_urls: false
# the copied Solid 2.0 reference (docs/solid-2.0/README.md) is for developers, not part of the site
exclude_docs: |
  solid-2.0/
validation:
  anchors: warn
theme:
  name: material
  language: de
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: { icon: material/weather-night, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: { icon: material/weather-sunny, name: Hell }
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Soll: index.md
  - Installation: installation.md
  - Einrichtung: einrichtung.md
  - Anmeldung, Rollen und Module: anmeldung.md
  - Stempeln: stempeln.md
  - Terminal: terminal.md
  - Monatsabschluss und Prüfwert: monatsabschluss.md
  - Prüfexport und Auskunft: pruefexport.md
  - Projektzeit: projektzeit.md
  - Erinnerungen: erinnerungen.md
  - DATEV-Lohnexport: datev.md
  - Dienstplan: dienstplan.md
  - REST-API und MCP-Server: api.md
  - Regelwerk: regeln.md
  - Arbeitstag aus Stempelungen: arbeitstag.md
  - Prüfung nach §§ 3 bis 5 ArbZG: pruefung.md
  - Bereitschaftsdienst und Rufbereitschaft: bereitschaft.md
  - Prüfung nach §§ 2, 6, 9 bis 11 ArbZG: nacht-sonntag.md
  - Mindestlohn, Aufzeichnung und Minijob: mindestlohn.md
  - Prüfung nach JArbSchG und MuSchG: jugend-mutterschutz.md
  - Soll, Ist und Konten: konten.md
  - Zuschläge nach § 3b EStG: zuschlaege.md
  - Jahreswerte: jahreswerte.md
  - Feiertage: feiertage.md
  - Entwicklung:
      - Projektplan: plan.md
      - Aufbau und Befehle: entwicklung.md
      - Audit-Kette und Prüfwert: audit-kette.md
      - Gesetzeswächter: gesetzeswaechter.md
